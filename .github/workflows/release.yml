name: Release

# 推送形如 v1.2.3 的标签时：
# 1. 在 macOS 上编译后端，连同 Web 界面打包为 tar.gz 并发布到 GitHub Releases
# 2. 构建 Web 界面的 Docker 镜像并推送到 GHCR
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  macos-binary:
    name: macOS binary
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vision-web/package-lock.json

      - name: Build web UI (same-origin API)
        working-directory: vision-web
        env:
          VITE_API_BASE_URL: /
        run: |
          npm ci
          npm run build

      - name: Build backend
        run: swift build -c release --arch arm64

      - name: Package
        run: |
          set -euo pipefail
          NAME="vision-api-macos-arm64"
          mkdir -p "dist/$NAME"
          cp "$(swift build -c release --arch arm64 --show-bin-path)/App" "dist/$NAME/vision-api"
          cp -R Public "dist/$NAME/Public"
          cp -R vision-web/dist/. "dist/$NAME/Public/"
          cp README.md LICENSE.txt "dist/$NAME/"
          tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"
          (cd dist && shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: vision-api-macos-arm64
          path: |
            dist/vision-api-macos-arm64.tar.gz
            dist/vision-api-macos-arm64.tar.gz.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/vision-api-macos-arm64.tar.gz
            dist/vision-api-macos-arm64.tar.gz.sha256

  web-image:
    name: Web image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: docker/build-push-action@v6
        with:
          context: vision-web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
