name: Release

# 发布一个版本：
# 1. 在 macOS 上编译后端，连同 Web 界面打包为 tar.gz 并发布到 GitHub Releases
# 2. 构建 Web 界面的 Docker 镜像并推送到 GHCR
#
# 两种触发方式：
# - 在 Actions 页面手动运行本工作流并填写版本号（如 1.0.0），工作流会创建 v1.0.0 标签和 Release
# - 推送形如 v1.0.0 的标签
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，不带 v 前缀，例如 1.0.0（需与 Sources/VisionAPI/configure.swift 中的 version 一致）"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::版本号必须是 X.Y.Z 形式，收到：$VERSION"
            exit 1
          fi
          SOURCE_VERSION=$(sed -n 's/^public let version = "\(.*\)"$/\1/p' Sources/VisionAPI/configure.swift)
          if [ "$SOURCE_VERSION" != "$VERSION" ]; then
            echo "::error::要发布的版本 $VERSION 与代码中的 version（$SOURCE_VERSION）不一致，请先更新 Sources/VisionAPI/configure.swift"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  macos-binary:
    name: macOS binary
    needs: prepare
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vision-web/package-lock.json

      - name: Build web UI (same-origin API)
        working-directory: vision-web
        env:
          VITE_API_BASE_URL: /
        run: |
          npm ci
          npm run build

      - name: Build backend
        run: swift build -c release --arch arm64

      - name: Package
        run: |
          set -euo pipefail
          NAME="vision-api-macos-arm64"
          mkdir -p "dist/$NAME"
          cp "$(swift build -c release --arch arm64 --show-bin-path)/App" "dist/$NAME/vision-api"
          cp -R Public "dist/$NAME/Public"
          cp -R vision-web/dist/. "dist/$NAME/Public/"
          cp README.md LICENSE.txt "dist/$NAME/"
          tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"
          (cd dist && shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256")

      - name: Smoke test the packaged binary
        run: |
          set -euo pipefail
          cd dist/vision-api-macos-arm64
          ./vision-api serve --env production --hostname 127.0.0.1 --port 8099 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8099/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8099/health
          echo
          curl -fsS http://127.0.0.1:8099/capabilities
          echo
          # Web 界面与 Swagger 静态文件都应可访问
          curl -fsS -o /dev/null http://127.0.0.1:8099/
          curl -fsS -o /dev/null http://127.0.0.1:8099/Swagger/index.html
          curl -fsS -o /dev/null http://127.0.0.1:8099/Swagger/swagger.json

      - uses: actions/upload-artifact@v4
        with:
          name: vision-api-macos-arm64
          path: |
            dist/vision-api-macos-arm64.tar.gz
            dist/vision-api-macos-arm64.tar.gz.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Vision API ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: |
            dist/vision-api-macos-arm64.tar.gz
            dist/vision-api-macos-arm64.tar.gz.sha256

  web-image:
    name: Web image (GHCR)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: vision-web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
