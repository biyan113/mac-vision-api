name: CI

on:
  push:
    branches: [master, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Build
        run: |
          set -o pipefail
          swift build 2>&1 | tee build.log
      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log
      - name: Error summary
        if: failure()
        run: |
          echo "==== unique errors ===="
          cat build.log test.log 2>/dev/null | grep -E "error:|failed|Fatal error" | sed 's/^.*mac-vision-api\/mac-vision-api\///' | sort -u | head -80

  web:
    name: Web (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vision-web/package-lock.json
      - run: npm ci
      - run: npm run build
