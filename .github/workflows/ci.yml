name: CI

on:
  push:
    branches: [master, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Build
        run: |
          set -o pipefail
          swift build 2>&1 | tee build.log
      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log
      - name: Error summary
        if: failure()
        run: |
          echo "==== unique errors ===="
          cat build.log test.log 2>/dev/null | grep -E "error:|failed|Fatal error" | sed 's/^.*mac-vision-api\/mac-vision-api\///' | sort -u | head -80

  web:
    name: Web (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vision-web/package-lock.json
      - run: npm ci
      - run: npm run build

  install:
    name: Install script (latest release)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install latest release with scripts/install.sh
        env:
          VISION_API_HOME: ${{ runner.temp }}/vision-api
        run: bash scripts/install.sh
      - name: Start and check the installed service
        env:
          VISION_API_HOME: ${{ runner.temp }}/vision-api
        run: |
          set -euo pipefail
          cd "$VISION_API_HOME"
          test -x ./vision-api
          test -f Public/index.html
          ./vision-api serve --env production --hostname 127.0.0.1 --port 8099 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8099/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8099/health
          echo
          curl -fsS -o /dev/null http://127.0.0.1:8099/
          curl -fsS -o /dev/null http://127.0.0.1:8099/Swagger/index.html

  ios:
    name: iOS app (build)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test core logic
        run: swift test --package-path ios/LensCore
      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for iOS Simulator
        working-directory: ios
        run: |
          set -euo pipefail
          # 不用管道过滤输出，避免掩盖 xcodebuild 的退出码
          xcodebuild build \
            -project LensTranslate.xcodeproj \
            -scheme LensTranslate \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO
      - name: Verify the app bundle was produced
        working-directory: ios
        run: |
          set -euo pipefail
          APP=build/Build/Products/Debug-iphonesimulator/LensTranslate.app
          test -d "$APP"
          test -f "$APP/LensTranslate"
          test -f "$APP/Info.plist"
          ls -la "$APP" | head -20
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$APP/Info.plist"
          # 确认应用的代码确实被编译进了二进制
          nm -gU "$APP/LensTranslate" 2>/dev/null | head -5 || true
          find build/Build/Intermediates.noindex -name "RootView.o" | head -1 | grep -q RootView.o
      - name: Launch in the simulator
        working-directory: ios
        run: |
          set -euo pipefail
          APP=build/Build/Products/Debug-iphonesimulator/LensTranslate.app
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          phones = [d for runtime, items in devices.items() if 'iOS' in runtime for d in items if d['name'].startswith('iPhone')]
          print(phones[-1]['udid'] if phones else '')
          ")
          if [ -z "$DEVICE" ]; then
            echo "::warning::runner 上没有可用的 iPhone 模拟器，跳过启动检查"
            exit 0
          fi
          echo "simulator=${DEVICE} bundle=${BUNDLE_ID}"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          # 预先授予权限，避免系统弹窗挡住界面
          xcrun simctl privacy "$DEVICE" grant camera "$BUNDLE_ID" || true
          xcrun simctl privacy "$DEVICE" grant microphone "$BUNDLE_ID" || true
          xcrun simctl privacy "$DEVICE" grant speech-recognition "$BUNDLE_ID" || true
          xcrun simctl launch "$DEVICE" "$BUNDLE_ID"
          sleep 12
          xcrun simctl io "$DEVICE" screenshot launch.png
          # 启动 12 秒后进程仍在，说明没有启动即崩溃
          if xcrun simctl spawn "$DEVICE" launchctl list | grep -q "$BUNDLE_ID"; then
            echo "应用仍在运行"
          else
            echo "::error::应用启动后已退出"
            ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | tail -5 || true
            exit 1
          fi
      - name: Read the launch screenshot
        working-directory: ios
        run: |
          set -euo pipefail
          if [ ! -f launch.png ]; then
            echo "::warning::没有截图（未找到模拟器），跳过界面检查"
            exit 0
          fi
          # 底部的模式切换是任何状态下都应该出现的界面元素
          swift ci/read-screenshot.swift launch.png 翻译 学词 对话
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-launch-screenshot
          path: ios/launch.png
          if-no-files-found: ignore
