# Vision API Web 界面
#
# 后端依赖 Apple Vision / PDFKit / Speech 等 macOS 框架，不能运行在 Linux 容器中。
# 请先在 Mac 上启动后端（见 README），再用本文件启动 Web 界面：
#
#   docker compose up -d        # 使用已发布的镜像
#   docker compose up --build   # 从源码构建
#
# 然后访问 http://localhost:3000
services:
  web:
    image: ghcr.io/biyan113/mac-vision-api-web:latest
    build:
      context: ./vision-web
    environment:
      # 后端地址。默认指向宿主机 8080 端口
      VISION_API_UPSTREAM: ${VISION_API_UPSTREAM:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:80"
    restart: unless-stopped
